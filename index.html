<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Briscola al tavolo</title>
<style>
:root{
  --felt:#1C4034; --felt-deep:#102A22; --felt-line:#2E5A4A;
  --card:#F3E7CD; --card-edge:#D9C79E; --ink:#241A0F;
  --oro:#D69A24; --dim:#9DBBAC;
  --display:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:#EFE7D6;min-height:100dvh;overscroll-behavior:none;
  background:radial-gradient(120% 80% at 50% 0%,#26523F 0%,var(--felt) 45%,var(--felt-deep) 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 24px;min-height:100dvh;display:flex;flex-direction:column}
.brand{text-align:center;margin:22px 0 6px}
.brand h1{font-family:var(--display);font-size:clamp(36px,12vw,54px);line-height:.92;margin:0;font-weight:400;color:#F6EEDC}
.brand h1 em{display:block;font-size:.42em;font-style:normal;letter-spacing:.34em;text-transform:uppercase;
  color:var(--oro);margin-top:12px;padding-left:.34em}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--felt-line),transparent);margin:20px 0}
.lede{color:var(--dim);text-align:center;font-size:15px;line-height:1.5;margin:0 auto;max-width:34ch}
.panel{background:rgba(0,0,0,.18);border:1px solid var(--felt-line);border-radius:14px;padding:16px;margin-top:16px}
label.f{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
input[type=text]{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--felt-line);
  background:rgba(0,0,0,.25);color:#F6EEDC;font-size:17px;font-family:var(--ui)}
input[type=text]:focus{outline:2px solid var(--oro);outline-offset:1px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 0;border:1px solid var(--felt-line);border-radius:10px;background:rgba(0,0,0,.2);
  color:var(--dim);font-size:14px}
.seg button[aria-pressed=true]{background:var(--oro);color:#241A0F;border-color:var(--oro);font-weight:600}
.btn{display:block;width:100%;padding:14px;border-radius:11px;background:var(--oro);color:#241A0F;
  font-weight:700;font-size:16px;margin-top:14px}
.btn.ghost{background:transparent;border:1px solid var(--felt-line);color:#EFE7D6;font-weight:600}
.btn[disabled]{opacity:.45}
.code-in{text-align:center;letter-spacing:.5em;text-transform:uppercase;font-size:26px;font-family:var(--display)}
.err{color:#F0A99F;font-size:14px;margin-top:10px;min-height:1.2em}
.hint{color:var(--dim);font-size:13px;line-height:1.5;margin-top:10px}
.roomcode{font-family:var(--display);font-size:46px;letter-spacing:.22em;color:var(--oro);text-align:center;
  margin:4px 0 2px;padding-left:.22em}
.seatlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.seatlist li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
  background:rgba(0,0,0,.2);border:1px solid var(--felt-line);font-size:15px}
.seatlist li .n{width:22px;height:22px;border-radius:50%;background:var(--felt-line);display:grid;
  place-items:center;font-size:11px;flex:none}
.seatlist li.me{border-color:var(--oro)}
.seatlist li .team{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.seatlist li.empty{color:var(--dim);font-style:italic}
.topbar{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding-bottom:10px}
.topbar .sp{margin-left:auto}
.topbar button{color:var(--dim);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#C0563F;flex:none}
.dot.on{background:#5FBF8A}
.opps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.opp{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.22);
  border:1px solid transparent;font-size:13px}
.opp.turn{border-color:var(--oro);box-shadow:0 0 0 3px rgba(214,154,36,.14)}
.opp .mini{display:flex}
.opp .mini i{width:9px;height:14px;border-radius:2px;background:linear-gradient(160deg,#8E2A24,#5E1A16);
  border:1px solid #40100D;margin-left:-3px;display:block}
.opp .mini i:first-child{margin-left:0}
.felt{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;
  position:relative;padding:10px 0;min-height:210px}
.felt::before{content:"";position:absolute;inset:0;border-radius:20px;border:1px solid rgba(255,255,255,.05);
  background:radial-gradient(60% 50% at 50% 45%,rgba(255,255,255,.05),transparent 70%)}
.played{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;position:relative;min-height:118px;align-items:center}
.playedwrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.playedwrap small{font-size:11px;color:var(--dim);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{font-family:var(--display);font-size:19px;text-align:center;position:relative;padding:0 12px}
.msg b{color:var(--oro);font-weight:400}
.deckbox{position:absolute;right:2px;top:6px;display:flex;align-items:center;gap:2px}
.deckbox .cnt{font-size:11px;color:var(--dim);margin-right:6px}
.backcard{width:46px;height:70px;border-radius:6px;border:1px solid #40100D;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.16) 0 4px,transparent 4px 8px),
  linear-gradient(160deg,#8E2A24,#5E1A16);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.trumpslot{transform:rotate(90deg);margin-left:-16px}
.hand{display:flex;gap:9px;justify-content:center;padding-top:14px;min-height:126px;align-items:flex-end}
.slot{padding:0;border-radius:9px;transition:transform .16s ease}
.slot:disabled{opacity:.5}
.slot:not(:disabled):active{transform:translateY(-8px)}
.slot.playable:not(:disabled){box-shadow:0 0 0 2px rgba(214,154,36,.5),0 6px 14px rgba(0,0,0,.35);border-radius:9px}
.card{width:74px;height:112px;border-radius:8px;background:#fff var(--sheet) no-repeat;background-size:1000% 400%;border:1px solid var(--card-edge);
  box-shadow:0 3px 9px rgba(0,0,0,.32);position:relative;overflow:hidden;display:block;animation:in .22s ease both}
.card.sm{width:62px;height:94px}
.card.trump{outline:2px solid var(--oro);outline-offset:-2px}
@keyframes in{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.scores{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.sc{flex:1 1 90px;max-width:170px;text-align:center;padding:9px;border-radius:10px;background:rgba(0,0,0,.2);
  border:1px solid var(--felt-line)}
.sc .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.sc .val{font-family:var(--display);font-size:26px;color:var(--oro);line-height:1.2}
.sc.mine{background:rgba(214,154,36,.1)}
.sc.win{border-color:var(--oro)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ================= carte ================= */
const SUITS=[{id:'denari',nome:'Denari',col:'#D69A24'},{id:'coppe',nome:'Coppe',col:'#B12A22'},
             {id:'spade',nome:'Spade',col:'#2B5F86'},{id:'bastoni',nome:'Bastoni',col:'#2C7A50'}];
const PT={1:11,3:10,10:4,9:3,8:2}, STR={1:10,3:9,10:8,9:7,8:6,7:5,6:4,5:3,4:2,2:1};
const RK={1:'A',8:'F',9:'C',10:'R'}, FIG={8:'Fante',9:'Cavallo',10:'Re'};
const pts=c=>PT[c.r]||0, rkl=r=>RK[r]||String(r);
const ROW=[0,1,3,2];
function cardHTML(c,o){o=o||{};return `<div class="card${o.sm?' sm':''}${o.trump?' trump':''}" style="background-position:${(c.r-1)*100/9}% ${ROW[c.s]*100/3}%" aria-label="${rkl(c.r)} di ${SUITS[c.s].nome}"></div>`;}
/* ================= motore ================= */
function newDeck(n){const d=[];for(let s=0;s<4;s++)for(let r=1;r<=10;r++)d.push({s,r});
 const via=n===3?1:n===6?4:0; // si tolgono dei due: carte da zero punti, il totale resta 120
 for(let k=0;k<via;k++) d.splice(d.findIndex(c=>c.r===2),1);
 for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]];}return d;}
function trickWinner(t,tr){let best=t[0];for(const p of t.slice(1)){const a=p.c,b=best.c;
 if(a.s===b.s){if(STR[a.r]>STR[b.r])best=p;}else if(a.s===tr)best=p;}return best.seat;}
const nGroups=st=>st.teams?2:st.n;
const groupOf=(seat,st)=>st.teams?seat%2:seat;

/* ================= rete (MQTT pubblico) ================= */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081/mqtt'];
let cli=null, bi=0, connected=false;
let me={id:localStorage.bt_id||('p'+Math.random().toString(36).slice(2,9)),name:localStorage.bt_name||''};
localStorage.bt_id=me.id;
let code=null, isHost=false, mySeat=-1, S=null, resolving=false;
const T=c=>({s:'bt/'+c+'/s', a:'bt/'+c+'/a'});

function connect(cb){
  const url=BROKERS[bi%BROKERS.length]; bi++;
  cli=mqtt.connect(url,{clientId:'bt_'+me.id+'_'+Math.random().toString(16).slice(2,6),
    clean:true,connectTimeout:7000,reconnectPeriod:3000,keepalive:30});
  cli.on('connect',()=>{connected=true;paint();cb&&cb();cb=null;});
  cli.on('reconnect',()=>{connected=false;paint();});
  cli.on('close',()=>{connected=false;paint();});
  cli.on('error',()=>{});
  cli.on('message',(t,p)=>{
    let m; try{m=JSON.parse(p.toString());}catch(e){return;}
    if(!code) return;
    if(t===T(code).s){ if(!m.code){return;} S=m; syncSeat(); paint(); autoResolve(); }
    else if(t===T(code).a && isHost){ handle(m); }
  });
}
function pubState(){ if(cli&&S) cli.publish(T(code).s,JSON.stringify(S),{retain:true,qos:0}); }
function send(a){ a.id=me.id; if(isHost) handle(a); else if(cli) cli.publish(T(code).a,JSON.stringify(a),{qos:0}); }

/* ================= host: regole ================= */
function handle(a){
  if(!S) return;
  if(a.t==='join'){
    if(S.phase==='gioco') return;
    if(S.seats.some(s=>s.id===a.id)) return;
    if(S.seats.length>=6) return;
    S.seats.push({id:a.id,name:(a.name||'Ospite').slice(0,12)});
  }
  else if(a.t==='leave'){
    if(S.phase==='gioco') return;
    S.seats=S.seats.filter(s=>s.id!==a.id);
  }
  else if(a.t==='squadre'&&S.phase!=='gioco'){ S.teams=!!a.v; }
  else if(a.t==='start'&&S.phase!=='gioco'&&S.seats.length>=2) deal();
  else if(a.t==='play'&&S.phase==='gioco'){
    const seat=S.seats.findIndex(s=>s&&s.id===a.id);
    if(seat!==S.turn||S.table.length>=S.n) return;
    const c=S.hands[seat][a.i]; if(!c) return;
    S.hands[seat].splice(a.i,1); S.table.push({seat,c});
    S.turn = S.table.length<S.n ? (S.turn+1)%S.n : -1;
  }
  else if(a.t==='rematch'&&S.phase==='fine'&&S.seats.length>=2) deal();
  else return;
  pubState(); syncSeat(); paint(); autoResolve();
}
function deal(){
  S.n=S.seats.length;
  if(S.n%2||S.n<4) S.teams=false;
  const d=newDeck(S.n); S.hands={}; for(let i=0;i<S.n;i++)S.hands[i]=d.splice(0,3);
  S.trump=d[d.length-1]; S.trumpSuit=S.trump.s; S.deck=d;
  S.table=[]; S.turn=(S.first||0)%S.n; S.first=(S.first||0)+1;
  S.points=Array(nGroups(S)).fill(0); S.last=null; S.phase='gioco';
}
function autoResolve(){
  if(!isHost||!S||S.phase!=='gioco'||resolving) return;
  if(S.table.length!==S.n) return;
  resolving=true;
  setTimeout(()=>{
    const w=trickWinner(S.table,S.trumpSuit);
    const g=S.table.reduce((a,p)=>a+pts(p.c),0);
    S.points[groupOf(w,S)]+=g; S.last={pts:g};
    if(S.deck.length) for(let k=0;k<S.n;k++){const s=(w+k)%S.n; if(S.deck.length) S.hands[s].push(S.deck.shift());}
    S.table=[]; S.turn=w;
    if(!S.deck.length&&Object.values(S.hands).every(x=>!x.length)) S.phase='fine';
    resolving=false; pubState(); paint();
  },1700);
}

/* ================= flusso ================= */
const $=id=>document.getElementById(id);
function syncSeat(){ if(S) mySeat=S.seats.findIndex(s=>s&&s.id===me.id); }
const nomeDi=i=>(S.seats[i]?S.seats[i].name:'—');
const rnd=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ';return Array(4).fill(0).map(()=>A[Math.random()*A.length|0]).join('');};

function apri(){
  code=rnd(); isHost=true;
  S={code,phase:'attesa',seats:[{id:me.id,name:me.name}],teams:true,first:0}; mySeat=0;
  cli.subscribe(T(code).a,()=>{ pubState(); });
  location.hash=code; paint();
}
function entra(c){
  code=c; isHost=false; S=null; location.hash=c;
  cli.subscribe(T(code).s,()=>{ send({t:'join',name:me.name}); });
  paint();
  setTimeout(()=>{ if(!S) paint('Nessuno risponde al tavolo '+c+'. Fai ricontrollare il codice a chi l\'ha aperto, e che tenga l\'app aperta.'); },6000);
}
function esci(){ if(!isHost&&S) send({t:'leave'});
  if(cli){cli.unsubscribe(T(code).s);cli.unsubscribe(T(code).a);} 
  if(isHost&&cli) cli.publish(T(code).s,'',{retain:true});
  code=null;isHost=false;S=null;mySeat=-1;location.hash='';paint(); }

/* ================= viste ================= */
function paint(err){
  if(!S && !code) return lobby(err);
  if(!S) return attesaConn(err);
  if(S.phase==='attesa') return stanza();
  tavolo();
}
const conn=()=>`<span class="dot ${connected?'on':''}"></span><span>${connected?'in linea':'ricollego…'}</span>`;

  $('crea').onclick=()=>{ if(!nome())return paint('Scrivi un nome, così gli altri sanno chi sei.');
    me.name=nome(); localStorage.bt_name=me.name; if(!connected)return paint('Ancora non sono collegato. Un attimo e riprova.'); apri(); };
  $('go').onclick=()=>{ const c=($('cd').value||'').trim().toUpperCase();
    if(!nome())return paint('Scrivi un nome prima di entrare.');
    if(c.length!==4)return paint('Il codice è di quattro lettere.');
    me.name=nome(); localStorage.bt_name=me.name;
    if(!connected)return paint('Ancora non sono collegato. Un attimo e riprova.'); entra(c); };
  const h=location.hash.replace('#','').toUpperCase(); if(h.length===4&&!$('cd').value) $('cd').value=h;
}
function attesaConn(err){
  $('app').innerHTML=`<div class="topbar">${conn()}<span class="sp"></span><button id="x">Esci</button></div>
   <div class="felt"><p class="msg">Entro al tavolo <b>${code}</b>…</p></div>
   <p class="err" style="text-align:center">${err||''}</p>`;
  $('x').onclick=esci;
}
function stanza(){
  const k=S.seats.length, sq=S.teams&&k%2===0&&k>=4;
  const liberi=6-k;
  $('app').innerHTML=`
  <div class="topbar">${conn()}<span class="sp"></span><button id="x">Esci</button></div>
  <div class="roomcode">${S.code}</div>
  <p class="lede" style="font-size:14px">Detta le quattro lettere agli altri, oppure passa questo link: si apre gi\u00e0 col codice dentro.</p>
  <ul class="seatlist">${S.seats.map((s,i)=>`<li class="${s.id===me.id?'me':''}"><span class="n">${i+1}</span>${s.name}${s.id===me.id?' \u00b7 tu':''}${sq?`<span class="team">Squadra ${i%2?'B':'A'}</span>`:''}</li>`).join('')
    + (liberi>0?`<li class="empty"><span class="n">+</span>${liberi} post${liberi>1?'i':'o'} ancora liber${liberi>1?'i':'o'}</li>`:'')}</ul>
  ${isHost?`
    ${k===4||k===6?`<div class="seg" style="margin-top:14px" id="sq">
      <button data-v="1" aria-pressed="${S.teams?'true':'false'}">A squadre</button>
      <button data-v="0" aria-pressed="${S.teams?'false':'true'}">Ognuno per s\u00e9</button></div>`:''}
    <button class="btn" id="via" ${k<2?'disabled':''}>${k<2?'Serve almeno un altro giocatore':`Distribuisci le carte \u00b7 in ${k}`}</button>
    <button class="btn ghost" id="link">Copia il link del tavolo</button>`
  :`<p class="hint" style="text-align:center;margin-top:18px">Siete in ${k}. Le carte le d\u00e0 chi ha aperto il tavolo, quando volete.</p>`}
  <p class="hint">${k===3?'In tre si toglie un due dal mazzo, cos\u00ec i conti tornano e i punti restano 120. ':''}${k===6?'In sei si tolgono i quattro due: il totale resta 120. ':''}${k===5?'In cinque si gioca ognuno per s\u00e9, otto giri a testa. ':''}Chi ha aperto il tavolo fa da mazziere: deve tenere questa pagina aperta per tutta la partita.</p>`;
  $('x').onclick=esci;
  if($('via'))$('via').onclick=()=>send({t:'start'});
  if($('sq'))document.querySelectorAll('#sq button').forEach(b=>b.onclick=()=>send({t:'squadre',v:+b.dataset.v}));
  if($('link'))$('link').onclick=()=>{const u=location.href.split('#')[0]+'#'+S.code;
    navigator.clipboard?.writeText(u); $('link').textContent='Link copiato';};
}
function tavolo(){
  const n=S.n, hand=(S.hands&&S.hands[mySeat])||[], turn=S.turn, fin=S.phase==='fine';
  const nm=nomeDi, gm=groupOf(mySeat,S), G=nGroups(S);
  const opps=[]; for(let k=1;k<n;k++)opps.push((mySeat+k)%n);
  const top=Math.max(...S.points), vinc=S.points.map((p,g)=>p===top?g:-1).filter(g=>g>=0);
  let msg;
  if(fin){
    if(vinc.length>1) msg=`Pari a <b>${top}</b>`;
    else if(vinc[0]===gm) msg=S.teams?`Avete vinto con <b>${top}</b>`:`Hai vinto con <b>${top}</b>`;
    else msg=S.teams?`Vince l'altra squadra, <b>${top}</b>`:`Vince <b>${nm(vinc[0])}</b> con ${top}`;
  }
  else if(S.table.length===n){const w=trickWinner(S.table,S.trumpSuit);msg=`Presa di <b>${w===mySeat?'tuo':nm(w)}</b>`;}
  else if(turn===mySeat) msg='<b>Tocca a te</b>';
  else msg=`Gioca <b>${nm(turn)}</b>`;
  const eti=g=>S.teams?(g===gm?'La tua squadra':'Altra squadra'):(g===mySeat?'Tu':nm(g));
  $('app').innerHTML=`
  <div class="topbar">${conn()}<span class="sp"></span>
    <span>Briscola: <span style="color:${SUITS[S.trumpSuit].col}">${SUITS[S.trumpSuit].nome}</span></span>
    <button id="x" style="margin-left:10px">Esci</button></div>
  <div class="opps">${opps.map(i=>`<span class="opp ${turn===i?'turn':''}"><span>${nm(i)}${S.teams&&groupOf(i,S)===gm?' \u00b7 con te':''}</span>
    <span class="mini">${Array(((S.hands&&S.hands[i])||[]).length).fill('<i></i>').join('')}</span></span>`).join('')}</div>
  <div class="felt">
    <div class="deckbox"><span class="cnt">${S.deck.length}</span>
      ${S.deck.length>1?'<span class="backcard"></span>':''}
      ${S.deck.length?`<span class="trumpslot">${cardHTML(S.trump,{sm:1,trump:1})}</span>`:'<span style="font-size:11px;color:var(--dim)">mazzo finito</span>'}</div>
    <div class="played">${S.table.length
      ? S.table.map(p=>`<span class="playedwrap">${cardHTML(p.c)}<small>${p.seat===mySeat?'tu':nm(p.seat)}</small></span>`).join('')
      : (S.last?`<span style="color:var(--dim);font-size:13px">ultima presa: ${S.last.pts} punti</span>`:'')}</div>
    <p class="msg">${msg}</p></div>
  <div class="scores">${Array.from({length:G},(_,g)=>`
    <div class="sc ${fin&&vinc.includes(g)?'win':''}${g===gm?' mine':''}">
      <div class="lbl">${eti(g)}</div><div class="val">${S.points[g]}</div></div>`).join('')}</div>
  ${fin?(isHost?'<button class="btn" id="ri">Un\'altra mano</button>':'<p class="hint" style="text-align:center">Il mazziere pu\u00f2 dare di nuovo.</p>')
       :`<div class="hand">${hand.map((c,i)=>`<button class="slot ${turn===mySeat?'playable':''}" data-i="${i}" ${turn===mySeat&&S.table.length<n?'':'disabled'}>${cardHTML(c)}</button>`).join('')}</div>`}`;
  $('x').onclick=esci;
  if($('ri'))$('ri').onclick=()=>send({t:'rematch'});
  document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>send({t:'play',i:+b.dataset.i}));
}
connect(()=>paint());
paint();
</script>
</body>
</html>
